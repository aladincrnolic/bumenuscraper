
name: Update BU Dining Menus

on:
  schedule:
    # 8:17 AM Boston time every day (automatically handles DST).
    - cron: '17 8 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:  # Allow a manual run from the Actions tab.

# Required to commit the validated menu and retained archives.
permissions:
  contents: write

# Do not allow two refreshes to race with one another.
concurrency:
  group: bu-menu-update
  cancel-in-progress: false

jobs:
  update-menus:
    # Publishing should only happen on the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository and archive history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required to recover archive dates from Git history.

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Run backend unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Determine today's Boston menu date
        id: menu-date
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          today = now.astimezone(ZoneInfo('America/New_York')).date()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'snapshot_date={today.isoformat()}\n')
              output.write(f'started_at_utc={now.isoformat()}\n')
          print(f'Requesting menu dates starting {today.isoformat()}')
          PY

      # Git checkout resets filesystem modification times.
      # Recover a conservative age for previously committed archives.
      - name: Restore tracked archive file ages
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ['git', 'ls-files', '-z', '--', 'data/archive/']
          ).split(b'\0')
          restored = 0
          for raw_path in tracked:
              if not raw_path:
                  continue
              name = os.fsdecode(raw_path)
              path = Path(name)
              if not path.is_file() or path.is_symlink():
                  continue
              commit_time = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%ct', '--', name],
                  text=True
              ).strip()
              if commit_time.isdecimal():
                  timestamp = int(commit_time)
                  os.utime(path, (timestamp, timestamp))
                  restored += 1
          print(f'Restored ages for {restored} tracked archive files.')
          PY

      - name: Scrape new BU menus
        run: >-
          python scripts/scrape_bu_menus.py
          --snapshot-date "${{ steps.menu-date.outputs.snapshot_date }}"
          --refresh

      - name: Verify newly published dataset and seven-day freshness
        env:
          SNAPSHOT_DATE: ${{ steps.menu-date.outputs.snapshot_date }}
          STARTED_AT_UTC: ${{ steps.menu-date.outputs.started_at_utc }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import date, datetime, timedelta
          from pathlib import Path

          path = Path('data/current/menus.json')
          dataset = json.loads(path.read_text(encoding='utf-8'))
          snapshot_date = os.environ['SNAPSHOT_DATE']
          if dataset.get('snapshot_date') != snapshot_date:
              sys.exit('ERROR: Published snapshot_date is not from this run.')

          timestamp = dataset.get('generated_at_utc')
          if not isinstance(timestamp, str):
              sys.exit('ERROR: Missing generated_at_utc timestamp.')
          generated = datetime.fromisoformat(timestamp.replace('Z', '+00:00'))
          started = datetime.fromisoformat(os.environ['STARTED_AT_UTC'])
          if generated.tzinfo is None or generated < started:
              sys.exit('ERROR: Menu dataset was not freshly generated.')

          first_day = date.fromisoformat(snapshot_date)
          dates = [(first_day + timedelta(days=offset)).isoformat()
                   for offset in range(7)]
          print('Validating menu dates:', ', '.join(dates))
          subprocess.run(
              [sys.executable, 'scripts/validate_freshness.py',
               '--dates', *dates],
              check=True
          )
          PY

      - name: Remove archives older than 30 days
        run: python scripts/cleanup_archives.py --retention-days 30 --delete

      - name: Commit validated menus and retained archives
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # -f allows these paths even when listed in .gitignore.
          # Do not stage data/staging/ or unvalidated temporary files.
          git add -f -- data/current/menus.json
          git add -A -f -- data/archive/

          if git diff --cached --quiet; then
            echo 'No menu or archive changes to publish.'
          else
            git commit -m "chore: update validated BU menus (${{ steps.menu-date.outputs.snapshot_date }})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
